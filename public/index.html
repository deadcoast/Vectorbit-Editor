<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6a1b9a" />
    <meta name="description" content="Vectorbit - Advanced Pixel Art Illustration Software" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vectorbit.example.com" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Vectorbit - Pixel Art Illustrator" />
    <meta property="og:description" content="Advanced Pixel-Art Illustration Software" />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:url" content="https://vectorbit.example.com" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vectorbit" />
    <meta name="twitter:description" content="Advanced Pixel-Art Illustration Software" />
    <meta name="twitter:image" content="/preview.png" />
    <meta name="twitter:creator" content="@vectorbit_official" />

    <title>Vectorbit - Pixel Art Illustrator</title>

    <!-- Resource Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload Critical Resources -->
    <link rel="preload" href="/styles/global.css" as="style" crossorigin="anonymous" />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      as="style"
      crossorigin="anonymous"
    />
    <link rel="preload" href="/main.js" as="script" crossorigin="anonymous" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <!-- Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
    />

    <!-- Critical CSS -->
    <style>
      :root {
        --primary-color: #6a1b9a;
        --primary-light: #9c4dcc;
        --primary-dark: #38006b;
        --highlight-color: #f06292;
        --secondary-color: #ff8f00;
        --font-family-primary: 'Poppins', sans-serif;
        --font-family-mono: 'Roboto Mono', monospace;
      }

      #root:empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
        color: white;
        font-family: var(--font-family-primary);
      }

      #root:empty::after {
        content: 'Loading Vectorbit...';
        font-size: 1.5rem;
        animation: pulse 1.5s infinite ease-in-out;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family-primary);
        background-color: #fafafa;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center">
        <h1 style="color: var(--primary-color)">JavaScript Required</h1>
        <p>Vectorbit requires JavaScript to run. Please enable JavaScript in your browser.</p>
      </div>
    </noscript>

    <div id="root" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="tooltip-root"></div>

    <!-- Error Boundary -->
    <script>
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
                    <div style="padding: 2rem; text-align: center;">
                        <h1 style="color: #d32f2f;">Oops! Something went wrong.</h1>
                        <p>An error occurred. Please refresh the page.</p>
                        <details style="background: #f9f9f9; padding: 1rem; border-radius: 4px; text-align: left;">
                            <summary>Details</summary>
                            <pre>${msg}</pre>
                        </details>
                    </div>
                `;
        }
        return false;
      };
    </script>

    <!-- Performance Monitoring -->
    <script>
      window.performance.mark('app-start');
      window.onload = () => {
        window.performance.mark('app-loaded');
        window.performance.measure('app-load-time', 'app-start', 'app-loaded');

        const loadTime = window.performance.getEntriesByName('app-load-time')[0]?.duration;
        console.info(`App loaded in ${Math.round(loadTime)}ms`);
      };
    </script>

    <!-- Progressive Web App -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/service-worker.js')
          .then(reg => console.log('Service Worker registered:', reg))
          .then(() => console.log('App is ready for offline use!'))
          .catch(err => console.error('Service Worker registration failed:', err));
      }
    </script>
  </body>
</html>
